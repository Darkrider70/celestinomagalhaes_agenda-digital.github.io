<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Ideia: um caderno de planeamento sobre a secretária — separadores coloridos no topo, abas de meses/semanas na margem, papel pontilhado. */
  --desk:#E3E7E1; --paper:#FCFCFA; --card:#FFFFFF; --ink:#1C2332; --muted:#5A6374; --line:#E0E3E8; --dot:#D3D8DE; --accent:#2B5BA6;
  --font-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font-body:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --t-hoje:#F2C75A; --t-mes:#9BC7A1; --t-semana:#8CC1E7; --t-ano:#C5B3E5; --t-ensino:#F0A69D; --t-reunioes:#9DD2CA; --t-correio:#F3B87B; --t-tarefas:#B9CA7D; --t-ligacoes:#C8CCD2;
  --s-google:#2E6FD1; --s-outlook:#5155C4; --s-ics:#69707D; --s-manual:#2D8A66; --s-aula:#C2553F; --s-aval:#B0457A; --s-feriado:#C8323A; --s-interrupcao:#B39A5E; --s-datas:#7A6A2E;
  --ok:#2D8A57; --warn:#B7791F; --bad:#C0392B;
  --shadow:0 1px 0 rgba(0,0,0,.04), 0 18px 40px -22px rgba(28,38,60,.35);
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#0F1216; --paper:#181D24; --card:#1D232B; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2B323C; --dot:#272D36; --accent:#8DB2F0;
    --t-hoje:#6E5B22; --t-mes:#33553A; --t-semana:#2C4F6D; --t-ano:#4B3E69; --t-ensino:#6A3A34; --t-reunioes:#2D5853; --t-correio:#6A4926; --t-tarefas:#4A5527; --t-ligacoes:#3A3F47;
    --s-google:#6EA0F0; --s-outlook:#9C9EF2; --s-ics:#9DA4B0; --s-manual:#5DC097; --s-aula:#EA8B74; --s-aval:#E487B5; --s-feriado:#F27C82; --s-interrupcao:#CFB77C; --s-datas:#D8C27A;
    --ok:#5DC08A; --warn:#E3B04F; --bad:#F07F72;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 18px 40px -20px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#0F1216; --paper:#181D24; --card:#1D232B; --ink:#E6E9EF; --muted:#9AA3B2; --line:#2B323C; --dot:#272D36; --accent:#8DB2F0;
  --t-hoje:#6E5B22; --t-mes:#33553A; --t-semana:#2C4F6D; --t-ano:#4B3E69; --t-ensino:#6A3A34; --t-reunioes:#2D5853; --t-correio:#6A4926; --t-tarefas:#4A5527; --t-ligacoes:#3A3F47;
  --s-google:#6EA0F0; --s-outlook:#9C9EF2; --s-ics:#9DA4B0; --s-manual:#5DC097; --s-aula:#EA8B74; --s-aval:#E487B5; --s-feriado:#F27C82; --s-interrupcao:#CFB77C; --s-datas:#D8C27A;
  --ok:#5DC08A; --warn:#E3B04F; --bad:#F07F72;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 18px 40px -20px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--desk); color:var(--ink); font:15px/1.5 var(--font-body); -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0; letter-spacing:-.01em}
h1{font-size:30px; font-weight:800; line-height:1.1}
h2{font-size:16.5px; font-weight:700}
h3{font-size:18px; font-weight:700}
.num,.tnum{font-variant-numeric:tabular-nums}
.hand{font-family:var(--font-hand); font-size:24px; line-height:1; color:var(--muted); margin:0 0 2px}
.muted{color:var(--muted)}
.small{font-size:13px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

.desk{max-width:1340px; margin:0 auto; padding:14px 16px 48px}
@media (min-width:1220px){ .desk{padding-right:64px} }

/* cabeçalho */
header.top{display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:4px 6px 12px}
.brand{display:flex; gap:10px; align-items:center; text-decoration:none; color:inherit}
.brand b{display:block; font:800 22px/1 var(--font-display); letter-spacing:-.015em}
.brand span{display:block; font-size:12.5px; color:var(--muted); margin-top:3px}
.today-lbl{margin-left:auto; font-weight:600; font-size:14px}
.today-lbl small{color:var(--muted); font-weight:500}
.status{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.dots{display:flex; gap:6px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 10px; cursor:pointer}
.dot{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; color:var(--muted)}
.dot i{width:8px; height:8px; border-radius:50%; background:var(--line); display:inline-block}
.dot.ok i{background:var(--ok)} .dot.err i{background:var(--bad)} .dot.loading i{background:var(--warn)}
.save{font-size:12.5px; color:var(--muted); padding:4px 10px; border-radius:999px; border:1px dashed var(--line)}
.save.err{color:var(--bad); border-color:var(--bad)}

/* separadores */
nav.tabs{display:flex; gap:4px; padding:0 14px; overflow-x:auto; scrollbar-width:none; position:relative; z-index:1}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none; padding:9px 15px 11px; border-radius:11px 11px 0 0; background:color-mix(in srgb, var(--tc) 50%, var(--desk)); color:var(--ink); text-decoration:none; font-weight:600; font-size:14px; transform:translateY(5px); transition:transform .15s ease; border:0; cursor:pointer}
.tab:hover{transform:translateY(2px)}
.tab[aria-current="page"]{background:var(--tc); transform:none}

main.paper{position:relative; background-color:var(--paper); background-image:radial-gradient(var(--dot) 1px, transparent 1.3px); background-size:22px 22px; background-position:11px 11px; border-radius:14px; box-shadow:var(--shadow); padding:26px 26px 32px; min-height:70vh}
main.paper::before{content:""; position:absolute; inset:0 0 auto 0; height:7px; border-radius:14px 14px 0 0; background:var(--tc)}

/* abas laterais */
.sidetabs{display:flex; gap:4px; overflow-x:auto; margin:-8px 0 16px; padding-bottom:4px; scrollbar-width:thin}
.sidetabs:empty{display:none}
.st{flex:none; border:0; cursor:pointer; background:color-mix(in srgb, var(--tc) 30%, var(--card)); color:var(--ink); font-weight:600; font-size:12px; padding:5px 9px; border-radius:7px; text-transform:uppercase; letter-spacing:.04em}
.st[aria-current="true"]{background:var(--tc)}
.st.now{box-shadow:inset 0 0 0 2px var(--ink)}
@media (min-width:1220px){
  .sidetabs{position:absolute; top:70px; right:-46px; flex-direction:column; margin:0; overflow:visible; max-height:none; width:46px}
  .sidetabs.long{max-height:calc(100% - 90px); overflow-y:auto; overflow-x:hidden; scrollbar-width:none}
  .sidetabs.long::-webkit-scrollbar{display:none}
  .st{border-radius:0 8px 8px 0; padding:7px 4px; width:44px; text-align:center}
  .st[aria-current="true"]{width:46px; box-shadow:2px 0 0 var(--tc)}
}

/* estrutura das páginas */
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px}
.page-head .meta{margin:6px 0 0; color:var(--muted); font-size:14px}
.head-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.grid-2{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:16px}
.grid-3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
.grid-2e{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
.col{display:flex; flex-direction:column; gap:16px; min-width:0}
@media (max-width:980px){ .grid-2,.grid-3,.grid-2e{grid-template-columns:minmax(0,1fr)} }
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:15px 16px; min-width:0}
.card > h2{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px}
.card > h2 .count{font:600 12px var(--font-body); color:var(--muted)}
.card.flag{border-left:5px solid var(--tc)}
.empty{color:var(--muted); font-size:14px; margin:4px 0}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.spacer{flex:1}

/* controlos */
.btn{border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 12px; font-weight:600; font-size:13.5px; cursor:pointer; text-decoration:none; color:var(--ink); display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb, var(--ink) 35%, var(--line))}
.btn.pri{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 9px; font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn[data-armed]{background:var(--bad); color:#fff; border-color:var(--bad)}
.btn[disabled]{opacity:.5; cursor:default}
.iconbtn{border:0; background:transparent; cursor:pointer; color:var(--muted); padding:2px 6px; border-radius:6px; font-size:16px; line-height:1}
.iconbtn:hover{background:var(--line); color:var(--ink)}
.field{display:flex; flex-direction:column; gap:3px; font-size:13px; color:var(--muted); font-weight:600}
.field input,.field select,.field textarea{font-weight:400; color:var(--ink)}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{background:var(--card); border:1px solid var(--line); border-radius:7px; padding:6px 9px; min-width:0}
input.line{border:0; border-bottom:1px dashed color-mix(in srgb, var(--ink) 22%, transparent); border-radius:0; background:transparent; padding:5px 2px; width:100%}
input.line:focus{border-bottom-style:solid; outline:none; border-bottom-color:var(--accent)}
textarea.ruled{width:100%; resize:vertical; border:0; border-radius:0; background-color:transparent; background-image:linear-gradient(transparent 27px, var(--line) 27px, var(--line) 28px); background-size:100% 28px; line-height:28px; padding:0 2px; min-height:112px}
textarea.ruled:focus{outline:none; background-image:linear-gradient(transparent 27px, color-mix(in srgb, var(--accent) 45%, var(--line)) 27px, color-mix(in srgb, var(--accent) 45%, var(--line)) 28px)}
.check{display:inline-flex; align-items:center; gap:7px; cursor:pointer; font-size:14px}
.check input{width:16px; height:16px; accent-color:var(--ink)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--card); border-radius:999px; padding:3px 10px; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.chip[aria-pressed="false"].src{opacity:.5}
.chip .sw{width:9px; height:9px; border-radius:2px; background:var(--c)}
.pill{display:inline-block; font-size:11.5px; font-weight:700; padding:1px 8px; border-radius:999px; background:color-mix(in srgb, var(--c, var(--muted)) 16%, var(--card)); color:color-mix(in srgb, var(--c, var(--muted)) 75%, var(--ink)); white-space:nowrap}
.pill.ok{--c:var(--ok)} .pill.err{--c:var(--bad)} .pill.warn{--c:var(--warn)} .pill.off{--c:var(--muted)}

/* cores por origem */
.s-google{--c:var(--s-google)} .s-outlook{--c:var(--s-outlook)} .s-ics{--c:var(--s-ics)} .s-manual{--c:var(--s-manual)} .s-aula{--c:var(--s-aula)} .s-aval{--c:var(--s-aval)} .s-feriado{--c:var(--s-feriado)} .s-interrupcao{--c:var(--s-interrupcao)} .s-datas{--c:var(--s-datas)}

/* entradas de agenda */
.ev{display:block; width:100%; text-align:left; border:0; border-left:3px solid var(--c); background:color-mix(in srgb, var(--c) 12%, var(--card)); color:var(--ink); border-radius:4px; padding:2px 6px; font-size:12.5px; line-height:1.3; cursor:pointer; overflow-wrap:anywhere}
.ev .t{font-variant-numeric:tabular-nums; font-weight:700; color:color-mix(in srgb, var(--c) 70%, var(--ink))}
.ev.allday{background:color-mix(in srgb, var(--c) 22%, var(--card)); font-weight:600}
.ev:hover{background:color-mix(in srgb, var(--c) 22%, var(--card))}

.timeline{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.tl{display:grid; grid-template-columns:88px minmax(0,1fr); gap:12px; padding:10px 0; border-top:1px dashed var(--line)}
.tl:first-child{border-top:0}
.tl .when{font-variant-numeric:tabular-nums; font-weight:700; font-size:14px}
.tl .when small{display:block; color:var(--muted); font-weight:500}
.tl .what{border-left:3px solid var(--c); padding-left:10px; min-width:0}
.tl .what b{display:block; font-size:15px; overflow-wrap:anywhere}
.tl .what .sub{font-size:13px; color:var(--muted); overflow-wrap:anywhere}
.tl .acts{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap}
.tl.now .when{color:var(--accent)}
.tl.past{opacity:.6}
.banner{display:flex; gap:8px; align-items:center; border-radius:8px; padding:6px 10px; margin-bottom:8px; font-weight:600; font-size:13.5px; background:color-mix(in srgb, var(--c) 14%, var(--card)); border-left:4px solid var(--c)}

.daylist{display:flex; flex-direction:column; gap:12px}
.daylist .dh{font-weight:700; font-size:13.5px; margin-bottom:4px; display:flex; gap:8px; align-items:baseline}
.daylist .dh small{color:var(--muted); font-weight:500}
.daylist .evs{display:flex; flex-direction:column; gap:3px}

/* mês */
.mgrid{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)) repeat(2,minmax(0,.78fr)); border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--card)}
.mgrid .wd{padding:6px 8px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); border-bottom:1px solid var(--line); background:color-mix(in srgb, var(--tc) 14%, var(--card))}
.cell{min-height:118px; padding:5px 6px 7px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:3px; cursor:pointer; min-width:0; background:var(--card)}
.cell:nth-child(7n){border-right:0}
.cell.we{background:color-mix(in srgb, var(--line) 30%, var(--card))}
.cell.out{background:color-mix(in srgb, var(--line) 45%, var(--card))}
.cell.out .dnum{opacity:.45}
.cell.hatch{background-image:repeating-linear-gradient(135deg, color-mix(in srgb, var(--s-interrupcao) 16%, transparent) 0 6px, transparent 6px 12px)}
.cell:hover{box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent)}
.dnum{font:700 14px var(--font-display); display:flex; justify-content:space-between; align-items:center; gap:4px}
.cell.today .dnum span:first-child{background:var(--ink); color:var(--paper); border-radius:999px; padding:0 7px}
.dnum .fer{font:600 11px var(--font-body); color:var(--s-feriado); text-align:right; overflow-wrap:anywhere}
.more{font-size:12px; color:var(--muted); font-weight:600}
.tdots{display:flex; gap:3px; margin-top:auto; font-size:11.5px; color:var(--muted)}
.mlist{display:none}
@media (max-width:720px){ .mgrid{display:none} .mlist{display:flex} }

/* semana */
.wgrid{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,.9fr); gap:10px}
@media (max-width:1100px){ .wgrid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:640px){ .wgrid{grid-template-columns:minmax(0,1fr)} }
.wday{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:6px; min-width:0}
.wday.today{box-shadow:inset 0 0 0 2px var(--ink)}
.wday.hatch{background-image:repeating-linear-gradient(135deg, color-mix(in srgb, var(--s-interrupcao) 14%, transparent) 0 6px, transparent 6px 12px)}
.wday h3{font-size:15px; display:flex; justify-content:space-between; align-items:baseline; gap:6px}
.wday h3 small{font:600 12px var(--font-body); color:var(--muted)}
.wday textarea.ruled{min-height:140px; font-size:14px}
.wend{display:flex; flex-direction:column; gap:10px}
.lbl{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:4px 0 0}

/* ano */
.yeargrid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px}
@media (max-width:1000px){ .yeargrid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:640px){ .yeargrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.mini{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 8px 10px; cursor:pointer; text-align:left}
.mini:hover{border-color:color-mix(in srgb, var(--ink) 30%, var(--line))}
.mini h3{font-size:14px; text-transform:capitalize; margin-bottom:4px}
.mini .g{display:grid; grid-template-columns:repeat(7,1fr); gap:1px; font-size:11px; text-align:center; font-variant-numeric:tabular-nums}
.mini .g span{padding:2px 0; border-radius:4px}
.mini .g .h{color:var(--muted); font-weight:700}
.mini .g .fer{background:color-mix(in srgb, var(--s-feriado) 22%, transparent); color:var(--s-feriado); font-weight:700}
.mini .g .int{background:color-mix(in srgb, var(--s-interrupcao) 26%, transparent)}
.mini .g .key{box-shadow:inset 0 -2px 0 var(--s-datas)}
.mini .g .tod{background:var(--ink); color:var(--paper)}
.mini .g .we{color:var(--muted)}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-top:10px}
.legend span{display:inline-flex; align-items:center; gap:5px}
.legend i{width:11px; height:11px; border-radius:3px; display:inline-block; background:var(--c)}

/* tabelas */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:9px; background:var(--card)}
table.t{border-collapse:collapse; width:100%; font-size:13.5px}
table.t th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; padding:7px 8px; border-bottom:1px solid var(--line); background:color-mix(in srgb, var(--tc) 12%, var(--card)); white-space:nowrap}
table.t td{padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td input[type=text],table.t td input[type=email],table.t td input[type=tel],table.t td input[type=number],table.t td input[type=date],table.t td input[type=time],table.t td select{border-color:transparent; background:transparent; width:100%}
table.t td input:hover,table.t td select:hover{border-color:var(--line)}
table.t td input:focus,table.t td select:focus{border-color:var(--accent); background:var(--card)}
table.t .c{text-align:center}
table.t td.fin{font-weight:800; font-variant-numeric:tabular-nums; text-align:center}
.pres{border:1px solid var(--line); background:var(--card); width:30px; height:28px; border-radius:6px; font-weight:800; cursor:pointer; font-size:12.5px}
.pres.P{background:color-mix(in srgb, var(--ok) 20%, var(--card)); color:var(--ok); border-color:transparent}
.pres.F{background:color-mix(in srgb, var(--bad) 18%, var(--card)); color:var(--bad); border-color:transparent}
.pres.J{background:color-mix(in srgb, var(--warn) 22%, var(--card)); color:var(--warn); border-color:transparent}
.hor{table-layout:fixed}
.hor td{height:46px}
.hor td input{text-align:center}

/* ensino */
.ens{display:grid; grid-template-columns:260px minmax(0,1fr); gap:16px}
@media (max-width:900px){ .ens{grid-template-columns:minmax(0,1fr)} }
.uclist{display:flex; flex-direction:column; gap:8px}
.uc{display:block; text-align:left; width:100%; cursor:pointer; background:var(--card); border:1px solid var(--line); border-left:6px solid var(--c); border-radius:9px; padding:9px 11px; color:var(--ink)}
.uc b{display:block; font-size:14px; line-height:1.25}
.uc span{display:block; font-size:12px; color:var(--muted); margin-top:2px}
.uc[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--c)}
.subtabs{display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line); margin:14px 0 14px}
.subtabs button{border:0; background:transparent; padding:7px 12px; font-weight:600; cursor:pointer; border-radius:8px 8px 0 0; color:var(--muted)}
.subtabs button[aria-current="true"]{color:var(--ink); box-shadow:inset 0 -3px 0 var(--c, var(--ink))}
.stats{display:flex; gap:10px; flex-wrap:wrap; margin:10px 0}
.stat{background:var(--card); border:1px solid var(--line); border-radius:9px; padding:8px 12px}
.stat b{display:block; font:800 22px var(--font-display); font-variant-numeric:tabular-nums}
.stat span{font-size:12px; color:var(--muted)}

/* reuniões e correio */
.reu{display:grid; grid-template-columns:330px minmax(0,1fr); gap:16px}
@media (max-width:900px){ .reu{grid-template-columns:minmax(0,1fr)} }
.mlistx{display:flex; flex-direction:column; gap:4px}
.mitem{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; text-align:left; width:100%; cursor:pointer; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--c); border-radius:8px; padding:7px 10px; color:var(--ink)}
.mitem b{font-size:14px; overflow-wrap:anywhere}
.mitem small{color:var(--muted); font-size:12px}
.mitem[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--c)}
.mail{display:flex; flex-direction:column; gap:2px; padding:9px 2px; border-top:1px dashed var(--line)}
.mail:first-child{border-top:0}
.mail .top{display:flex; gap:8px; align-items:baseline}
.mail .from{font-weight:700; font-size:13.5px; overflow-wrap:anywhere}
.mail .date{margin-left:auto; color:var(--muted); font-size:12px; white-space:nowrap; font-variant-numeric:tabular-nums}
.mail .subj{font-size:14px; overflow-wrap:anywhere}
.mail .snip{font-size:12.5px; color:var(--muted); overflow-wrap:anywhere}
.mail.unread .subj{font-weight:700}
.mail.unread .from::before{content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-right:6px; vertical-align:middle}
.mail .acts{display:flex; gap:6px; margin-top:4px}
.raw{max-height:260px; overflow:auto; font-size:12px; background:color-mix(in srgb, var(--line) 35%, var(--card)); border-radius:8px; padding:8px; white-space:pre-wrap; overflow-wrap:anywhere}
.note{font-size:13px; color:var(--muted); background:color-mix(in srgb, var(--line) 30%, var(--card)); border-radius:8px; padding:8px 10px; margin:8px 0}
.note.err{color:var(--bad); background:color-mix(in srgb, var(--bad) 9%, var(--card))}
.srcline{display:flex; gap:8px; flex-wrap:wrap; font-size:12.5px; margin-bottom:12px}

/* tarefas */
.task{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:8px; align-items:center; padding:5px 0; border-top:1px dashed var(--line)}
.task:first-child{border-top:0}
.task.done input.line{text-decoration:line-through; color:var(--muted)}
.task .meta{display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
.task .meta input[type=date]{padding:2px 6px; font-size:12.5px}
.task .meta select{padding:2px 6px; font-size:12.5px; max-width:180px}
.prio-alta{--c:var(--bad)} .prio-media{--c:var(--warn)} .prio-baixa{--c:var(--ok)}
.late{color:var(--bad); font-weight:700; font-size:12px}
.qadd{display:grid; grid-template-columns:minmax(0,1fr) auto auto auto auto; gap:8px; align-items:center}
@media (max-width:760px){ .qadd{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }

/* ligações */
.conn{display:flex; flex-direction:column; gap:8px}
.conn header{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.conn header h2{margin:0}
.logo{width:34px; height:34px; border-radius:9px; display:grid; place-items:center; font:800 15px var(--font-display); color:#fff; background:var(--c); flex:none}
.drop{border:2px dashed var(--line); border-radius:10px; padding:16px; text-align:center; color:var(--muted); font-size:14px}
.drop.over{border-color:var(--accent); color:var(--ink)}
details summary{cursor:pointer; font-weight:600}
code{font-size:12.5px; background:color-mix(in srgb, var(--line) 50%, transparent); padding:1px 5px; border-radius:5px; overflow-wrap:anywhere}

/* diálogo e avisos */
dialog{border:0; border-radius:14px; padding:0; width:min(560px, calc(100% - 32px)); background:var(--card); color:var(--ink); box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(16,20,28,.45)}
.dlg-h{display:flex; gap:10px; align-items:flex-start; padding:16px 18px 10px; border-bottom:1px solid var(--line); border-top:6px solid var(--c, var(--ink)); border-radius:14px 14px 0 0}
.dlg-h h3{flex:1; overflow-wrap:anywhere}
.dlg-b{padding:14px 18px; display:flex; flex-direction:column; gap:10px; max-height:65vh; overflow:auto}
.dlg-f{padding:12px 18px 16px; display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; border-top:1px solid var(--line)}
dl.kv{display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px 12px; margin:0; font-size:14px}
dl.kv dt{color:var(--muted); font-weight:600}
dl.kv dd{margin:0; overflow-wrap:anywhere}
.form{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.form .full{grid-column:1/-1}
#evform[data-dest="local"] .hide-local, #evform[data-dest="g"] .hide-g, #evform[data-dest="link"] .hide-link,
#evform[data-kind="outlook"] .hide-lo, #evform[data-kind="teams"] .hide-lt, #evform[data-kind="ics"] .hide-li{display:none}
#toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:10px; font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:all .2s ease; max-width:min(560px, calc(100% - 32px)); z-index:20}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
footer.foot{margin-top:18px; text-align:center; font-size:12.5px; color:var(--muted)}
@media (max-width:640px){ main.paper{padding:20px 14px 26px} h1{font-size:25px} .today-lbl{margin-left:0; width:100%} }
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }

/* ---------- Datas e horas vindas dos conectores ---------- */
function parseWhen(v){

const START_KEYS = ['start','startTime','start_time','startDateTime','start_datetime','dtstart','begin','startDate'];

    const s0 = e.start.d;
    const atTime = d => { const x = new Date(d); x.setHours(s0.getHours(), s0.getMinutes(), s0.getSeconds(), 0); return x; };
    let n = 0, guard = 0, stop = false;

      const days = (byday && byday.length ? byday.map(b => b.wd) : [s0.getDay()]).map(w => (w+6)%7).sort((a,b) => a-b);
      const wk0 = mondayOf(s0);

      }
    } else if (R.FREQ === 'MONTHLY') {
      const bmd = R.BYMONTHDAY ? R.BYMONTHDAY.split(',').map(Number) : null;
      for (let k = 0; !stop && guard++ < 2000; k += interval) {
        const y = s0.getFullYear(), mo = s0.getMonth() + k;
        const cands = [];

          for (const b of byday) {
            const first = new Date(y, mo, 1), last = new Date(y, mo+1, 0);

      for (let k = 0; !stop && guard++ < 300; k += interval) { const d = atTime(new Date(s0.getFullYear()+k, s0.getMonth(), s0.getDate())); if (d.getMonth() !== s0.getMonth()) continue; emit(d); }

function mediaPonderada(componentes, notasAluno){

  let acc = 0, w = 0;

async function loadMonth(src, mk, refresh=false){
  const cur = Live.ev[src][mk];
  if (cur && (cur.state === 'loading' || ((cur.state === 'ok' || cur.state === 'err') && !refresh))) return;
  Live.ev[src][mk] = { state:'loading', items: cur ? cur.items : [] };
  const key = src === 'google' ? 'google' : 'm365-cal';
  setStatus(key, 'loading'); scheduleRender();
  const [y, m] = mk.split('-').map(Number); const start = new Date(y, m-1, 1), end = new Date(y, m, 1);
  try {
    let items = [], at = Date.now();
    if (src === 'google') {
      for (const c of googleCals()) {
        const input = await buildInput('gcal_events', { start, end, calendarId: c.id, max: 250 });
        let token = null, page = 0;
        do {
          const r = await call('gcal_events', token ? { ...input, pageToken: token } : input, refresh);
          items.push(...normEvents(r.p, 'google', c.nome)); at = r.at;
          token = r.p && typeof r.p === 'object' ? r.p.nextPageToken : null; page++;
        } while (token && page < 4);
      }
    } else {
      let cursor = start, loops = 0, raw = '';
      while (loops++ < 5) {
        const input = await buildInput('m365_cal', { start: cursor, end, max: 50 });
        const r = await call('m365_cal', input, refresh);
        const got = normEvents(r.p, 'outlook', 'Outlook'); at = r.at;
        if (!got.length && typeof r.p === 'string' && r.p.trim()) raw = r.p.slice(0, 3000);
        items.push(...got);
        if (got.length < 50) break;
        const last = Math.max(...got.map(e => e.start.getTime()));
        if (last <= cursor.getTime()) break;
        cursor = new Date(last + 60e3);
      }
      Live.ev[src][mk + ':raw'] = items.length ? '' : raw;
    }
    const seen = new Set(); items = items.filter(e => !seen.has(e.id) && seen.add(e.id));
    Live.ev[src][mk] = { state:'ok', items, at };
    setStatus(key, 'ok');
  } catch(e) {
    Live.ev[src][mk] = { state:'err', items: cur ? cur.items : [], e };
    setStatus(key, 'err', e);
  }
  scheduleRender();
}
function ensureRange(start, end, refresh=false){
  for (const src of ['google','outlook']) if (srcOn(src)) for (const mk of monthKeys(start, end)) loadMonth(src, mk, refresh);
}
async function loadMail(which, refresh=false){
  const cur = which === 'teams' ? Live.teams : Live.mail[which];
  if (cur && (cur.state === 'loading' || !refresh)) return;
  const set = v => { if (which === 'teams') Live.teams = v; else Live.mail[which] = v; };
  set({ state:'loading', items: cur ? cur.items : [] });
  const key = which === 'gmail' ? 'gmail' : which === 'outlook' ? 'm365-mail' : 'teams';
  setStatus(key, 'loading'); scheduleRender();
  try {
    const s = S(); let r, items;
    if (which === 'gmail') {
      const q = (s.gmailQuery || '').trim() + (s.gmailUnread ? ' is:unread' : '');
      r = await call('gmail', await buildInput('gmail', { query: q.trim(), max: 25 }), refresh); items = normMails(r.p, 'gmail');

    } else {
      r = await call('teams', await buildInput('teams', { start: addDays(new Date(), -(+s.teamsDias || 7)), query: (s.teamsQuery || '').trim(), max: 25 }), refresh); items = normMsgs(r.p);
    }
    set({ state:'ok', items, at: r.at, raw: (!items.length && typeof r.p === 'string' && r.p.trim()) ? r.p.slice(0, 3000) : '' });
    setStatus(key, 'ok');
  } catch(e) {
    set({ state:'err', items: cur ? cur.items : [], e }); setStatus(key, 'err', e);
  }
  scheduleRender();
}
async function ligar(which){
  if (!Live.mcp) { toast('Abre a agenda no Claude para ligar as tuas contas.'); return; }
  if (!(await garantirSessao(which))) return;
  const s = S();
  if (which === 'google') {
    setStatus('google', 'loading'); Live.calsLoading = true; render(true);
    try {
      const base = await buildInput('gcal_cals', {});
      let cals = [], token = null, page = 0;
      do {
        const r = await call('gcal_cals', token ? { ...base, pageToken: token } : base, true);
        cals.push(...normCals(r.p)); token = r.p && typeof r.p === 'object' ? r.p.nextPageToken : null; page++;
      } while (token && page < 4);
      migrar();
      const prev = new Map((s.gcalCals || []).map(c => [c.id, c.on]));
      const lista = [{ id:'primary', nome:'Calendário principal' }, ...cals.filter(c => c.id !== 'primary' && !c.primary)];
      s.gcalCals = lista.map(c => ({ id: c.id, nome: c.nome, on: prev.has(c.id) ? prev.get(c.id) : c.id === 'primary' }));
      s.fontes.google = true; Store.mark('settings'); Live.ev.google = {};
      setStatus('google', 'ok'); toast('Google Calendar ligado' + (cals.length ? ` — ${cals.length} calendários encontrados; o principal fica escolhido.` : '.'));
    } catch(e) { setStatus('google', 'err', e); toast(errMsg(e, 'Google Calendar')); }
    Live.calsLoading = false;
  } else if (which === 'gmail') {
    s.fontes.gmail = true; Store.mark('settings'); Live.mail.gmail = null;
    await loadMail('gmail', true);
    if (Live.mail.gmail && Live.mail.gmail.state === 'ok') toast('Gmail ligado.'); else { toast(errMsg(Live.mail.gmail && Live.mail.gmail.e, 'Gmail')); }
  } else if (which === 'm365') {
    s.fontes.m365 = true; Store.mark('settings'); Live.ev.outlook = {}; Live.mail.outlook = null; Live.teams = null;
    if (s.m365.cal) await loadMonth('outlook', ym(new Date()), true);
    if (s.m365.mail) await loadMail('outlook', true);
    const bad = ['m365-cal','m365-mail'].map(k => Live.status[k]).find(x => x && x.state === 'err');
    toast(bad ? errMsg(bad.e, 'Microsoft 365') : 'Microsoft 365 ligado (Outlook e Teams).');
  }
  render(true);
}
function desligar(which){
  const s = S();
  if (which === 'google') { s.fontes.google = false; Live.ev.google = {}; delete Live.status.google; }
  if (which === 'gmail') { s.fontes.gmail = false; Live.mail.gmail = null; delete Live.status.gmail; }
  if (which === 'm365') { s.fontes.m365 = false; Live.ev.outlook = {}; Live.mail.outlook = null; Live.teams = null; delete Live.status['m365-cal']; delete Live.status['m365-mail']; delete Live.status.teams; }

function refreshAll(){

/* ---------- Agregação de entradas ---------- */
function icsBuckets(){ return Store.names().filter(n => n.startsWith('ics-')).map(n => ({ name:n, ...Store.get(n) })); }
function dayDate(s, h){ const d = parseYMD(s); if (h && /^\d{1,2}:\d{2}/.test(h)) { const [hh, mm] = h.split(':').map(Number); d.setHours(hh, mm, 0, 0); } return d; }
function derivedEvents(start, end){
  const s = S(), out = [];
  for (const f of feriadosEntre(start, end, s.municipal)) out.push({ id:'fer:'+f.date, src:'feriado', title:f.nome, start:parseYMD(f.date), end:addDays(parseYMD(f.date),1), allDay:true, tipo:f.tipo });
  for (const k of Store.get('anual').datas || []) {
    if (!k.ini) continue;
    const a = parseYMD(k.ini), b = addDays(parseYMD(k.fim && k.fim >= k.ini ? k.fim : k.ini), 1);
    if (a < end && b > start) out.push({ id:'dk:'+k.id, src: k.tipo === 'interrupcao' ? 'interrupcao' : 'datas', title: k.titulo || 'Data-chave', start:a, end:b, allDay:true, tipo:k.tipo });
  }
  for (const m of Store.get('eventos').lista || []) {
    if (!m.data) continue;
    const allDay = !!m.diaInteiro || !m.inicio;
    const a = allDay ? parseYMD(m.data) : dayDate(m.data, m.inicio);
    let b = allDay ? addDays(parseYMD(m.dataFim && m.dataFim >= m.data ? m.dataFim : m.data), 1) : dayDate(m.data, m.fim || m.inicio);
    if (!allDay && b <= a) b = new Date(a.getTime() + 3600e3);
    if (a < end && b > start) out.push({ id:'man:'+m.id, mid:m.id, src:'manual', title:m.titulo || '(sem título)', start:a, end:b, allDay, tipo:m.tipo, loc:m.local||'', join: safeUrl(m.link||''), desc:m.notas||'', online: !!safeUrl(m.link||'') });
  }
  for (const uc of Store.get('ucs').lista || []) {
    (uc.sessoes || []).forEach((x, i) => {
      if (!x.data) return;
      if (x.gId && srcOn('google')) return; // já está no Google Calendar e chega por lá
      const allDay = !x.hora; const a = allDay ? parseYMD(x.data) : dayDate(x.data, x.hora);
      const b = allDay ? addDays(a,1) : new Date(a.getTime() + (+uc.duracao || 90)*60e3);
      if (a < end && b > start) out.push({ id:'aula:'+uc.id+':'+x.id, src:'aula', cor:uc.cor, ucId:uc.id, title:`${uc.sigla || uc.nome} · ${x.tema || 'Sessão ' + (i+1)}`, start:a, end:b, allDay, loc: x.sala || '', desc: x.sumario || '' });
    });
    for (const av of uc.avaliacoes || []) {
      if (!av.data) continue; const a = parseYMD(av.data);
      if (a < end && addDays(a,1) > start) out.push({ id:'aval:'+uc.id+':'+av.id, src:'aval', ucId:uc.id, title:`${uc.sigla || uc.nome} · ${av.tipo || 'Avaliação'}${av.desc ? ': ' + av.desc : ''}`, start:a, end:addDays(a,1), allDay:true });
    }
  }
  for (const b of icsBuckets()) for (const e of b.eventos || []) if (e.s < end.getTime() && e.e > start.getTime())
    out.push({ id:'ics:'+e.i, src:'ics', title:e.t, start:new Date(e.s), end:new Date(e.e), allDay:!!e.a, loc:e.l, web:e.u, desc:e.x, cal:b.nome, online:/teams\.microsoft|meet\.google|zoom\.us|webex/i.test(`${e.l} ${e.x} ${e.u}`) });
  return out;
}
function eventsBetween(start, end){
  ensureRange(start, end);
  const live = [];
  for (const src of ['google','outlook']) {
    if (!srcOn(src)) continue;
    for (const mk of monthKeys(start, end)) { const c = Live.ev[src][mk]; if (c) for (const e of c.items) if (e.start < end && e.end > start) live.push(e); }
  }
  const hide = S().ocultas || {}; const seen = new Set();
  const all = [...live, ...derivedEvents(start, end)].filter(e => !hide[e.src] && !seen.has(e.id) && seen.add(e.id));
  all.sort((a,b) => (b.allDay - a.allDay) || (a.start - b.start) || a.title.localeCompare(b.title));
  for (const e of all) UI.evIndex.set(e.id, e);
  return all;
}
const onDay = (e, d) => e.start < addDays(d,1) && e.end > d;
function dayFlags(d, evs){
  const today = evs.filter(e => onDay(e, d));
  return { fer: today.filter(e => e.src === 'feriado'), int: today.some(e => e.src === 'interrupcao'), keys: today.filter(e => e.src === 'datas' || e.src === 'interrupcao') };
}
function isMeeting(e){
  if (e.src === 'manual') return e.tipo === 'reuniao';
  if (!['google','outlook','ics'].includes(e.src) || e.allDay) return false;
  return e.online || e.atts > 1 || /reuni|meeting|conselho|call|teams|zoom|orienta|júri|juri|assembleia|comiss/i.test(e.title);
}
function srcLabel(e){ if (e.src === 'aula' || e.src === 'aval') return FONTES[e.src][0]; const f = FONTES[e.src]; return (f ? f[0] : e.src) + (e.cal && e.src !== 'outlook' ? ' · ' + e.cal : ''); }
function fmtWhen(e){
  if (e.allDay) {
    const last = addDays(e.end, -1);
    return sameDayStr(e.start, last) ? `${cap(fmtLong(e.start))} · dia inteiro` : `${fmtShort(e.start)} – ${fmtShort(last)} · dia inteiro`;

  return `${cap(fmtLong(e.start))} · ${hm(e.start)}–${hm(e.end)}`;
}

            <div class="what"><b>${esc(e.title)}</b>

              <div class="acts">${e.join ? `<a class="btn sm pri" href="${esc(e.join)}" target="_blank" rel="noopener">Entrar na reunião</a>` : ''}<button class="btn sm" data-act="ev" data-id="${esc(e.id)}">Detalhes</button>${isMeeting(e) ? `<button class="btn sm ghost" data-act="notas" data-id="${esc(e.id)}">Notas da reunião</button>` : ''}</div>
            </div></li>`; }).join('')}</ol>` : `<p class="empty">${allDay.length ? 'Sem compromissos com hora.' : 'Sem entradas para hoje.'} ${(!S().fontes.google && !S().fontes.m365) ? 'Liga os teus calendários para veres aqui as reuniões.' : ''}</p>`}
      </section>
      <section class="card"><h2>Próximos dias</h2>
        <div class="daylist">${[1,2,3,4,5,6,7].map(i => { const d = addDays(t, i); const de = evs.filter(e => onDay(e, d)); return `<div><div class="dh">${cap(DIAS[wdIdx(d)])} <small>${fmtShort(d)}</small></div><div class="evs">${de.length ? de.slice(0, 6).map(evChip).join('') + (de.length > 6 ? `<button class="more btn ghost sm" data-act="dia" data-d="${ymd(d)}">+${de.length - 6} mais</button>` : '') : '<span class="muted small">Livre</span>'}</div></div>`; }).join('')}</div>
      </section>
    </div>
    <div class="col">
      <section class="card"><h2>Prioridades do dia</h2>
        ${[0,1,2].map(i => `<div class="row" style="flex-wrap:nowrap"><span class="hand" style="font-size:22px;width:18px">${i+1}</span><input class="line" type="text" id="p${i}" data-bind="${dayPath(t,'p'+i)}" value="${esc(dayVal(t,'p'+i))}" placeholder="${['O que tem mesmo de ficar feito hoje?','Segunda prioridade','Terceira prioridade'][i]}"></div>`).join('')}
      </section>
      <section class="card"><h2>Tarefas <span class="count">${tasks.length} para hoje ou atrasadas</span></h2>
        ${tasks.length ? tasks.slice(0, 8).map(taskRow).join('') : '<p class="empty">Nada pendente para hoje.</p>'}
        <div class="row" style="margin-top:8px; flex-wrap:nowrap"><input type="text" id="qt-hoje" placeholder="Nova tarefa para hoje…" style="flex:1" data-enter="tarefa-rapida"><button class="btn sm" data-act="tarefa-rapida">Juntar</button></div>
      </section>
      <section class="card"><h2>Correio recente ${mails.length ? '<button class="btn sm" data-act="mail-novo">Escrever</button>' : ''}</h2>
        ${mails.length ? mails.map(([nome, m, src]) => `<p class="lbl">${nome}</p>${!m || m.state === 'loading' ? '<p class="empty">A carregar…</p>' : m.state === 'err' ? `<div class="note err">${esc(errMsg(m.e, nome === 'Gmail' ? 'Gmail' : 'Microsoft 365'))}</div>` : (m.items.length ? mailList([...m.items].sort((a,b) => b.unread - a.unread), src, 4) : (m.raw ? `<details><summary>Ver resposta do conector</summary><div class="raw">${esc(m.raw)}</div></details>` : '<p class="empty">Caixa em dia.</p>'))}`).join('') + `<button class="btn sm ghost" data-act="go" data-v="correio" style="margin-top:8px">Abrir Correio e Teams</button>`
          : `<p class="empty">Liga o Gmail ou o Outlook para veres aqui as mensagens recentes.</p>
            ${Live.mcp ? '<div class="row"><button class="btn sm" data-act="ligar" data-s="gmail">Ligar Gmail</button><button class="btn sm" data-act="ligar" data-s="m365">Ligar Outlook</button></div>' : ''}
`}
      </section>
      <section class="card"><h2>Nota do dia</h2><textarea class="ruled" id="nota-hoje" data-bind="${dayPath(t,'nota')}" placeholder="Ideias, recados, o que correu bem…">${esc(dayVal(t,'nota'))}</textarea></section>
      <section class="card"><h2>Bem-estar</h2>
        <div class="chips" style="flex-direction:column; align-items:flex-start; gap:6px">${bem.map(([k,l]) => `<label class="check"><input type="checkbox" id="bem-${k}" data-bind="${dayPath(t,'bem_'+k)}" ${dayVal(t,'bem_'+k) ? 'checked' : ''}> ${l}</label>`).join('')}</div>
        <input class="line" type="text" id="bem-bom" style="margin-top:8px" data-bind="${dayPath(t,'bom')}" value="${esc(dayVal(t,'bom'))}" placeholder="Uma coisa boa de hoje">
      </section>
    </div>
  </div>`;
}

/* ---------- Vista: Mês ---------- */
function vMes(){
  const sy = schoolYear(S().inicio);
  if (!UI.mes) UI.mes = ym(new Date());
  const [y, m] = UI.mes.split('-').map(Number);
  const first = new Date(y, m-1, 1), last = new Date(y, m, 0);
  const gStart = mondayOf(first), gEnd = addDays(mondayOf(last), 7);
  const evs = eventsBetween(gStart, gEnd);
  const tasks = Store.get('tarefas').lista.filter(x => !x.feito && x.data);
  const todayS = ymd(new Date());
  let cells = '';
  for (let d = new Date(gStart); d < gEnd; d = addDays(d, 1)) {
    const de = evs.filter(e => onDay(e, d));
    const fl = dayFlags(d, evs);
    const shown = de.filter(e => e.src !== 'feriado' && e.src !== 'interrupcao');
    const nt = tasks.filter(x => x.data === ymd(d)).length;
    cells += `<div class="cell${d.getMonth() !== m-1 ? ' out' : ''}${wdIdx(d) >= 5 ? ' we' : ''}${ymd(d) === todayS ? ' today' : ''}${fl.int ? ' hatch' : ''}" data-act="dia" data-d="${ymd(d)}" role="button" tabindex="0" aria-label="${esc(fmtLong(d))}">
      <div class="dnum"><span>${d.getDate()}</span>${fl.fer.length ? `<span class="fer">${esc(fl.fer[0].title)}</span>` : ''}</div>
      ${shown.slice(0, 4).map(evChip).join('')}${shown.length > 4 ? `<span class="more">+${shown.length - 4} mais</span>` : ''}
      ${nt ? `<div class="tdots">${nt} ${nt === 1 ? 'tarefa' : 'tarefas'}</div>` : ''}
    </div>`;
  }
  const monthEvs = evs.filter(e => e.start <= last && e.end > first);
  const hide = S().ocultas || {};
  const keyDates = monthEvs.filter(e => ['datas','interrupcao','feriado','aval'].includes(e.src));
  const mk = UI.mes;
  return `
  <section class="page-head">
    <div><p class="hand">${y}</p><h1 style="text-transform:capitalize">${MESES[m-1]}</h1><p class="meta">${monthEvs.filter(e => !['feriado','datas','interrupcao'].includes(e.src)).length} entradas este mês</p></div>
    <div class="head-actions"><button class="btn" data-act="mes-nav" data-k="-1" aria-label="Mês anterior">‹ Anterior</button><button class="btn" data-act="mes-nav" data-k="0">Este mês</button><button class="btn" data-act="mes-nav" data-k="1" aria-label="Mês seguinte">Seguinte ›</button><button class="btn pri" data-act="novo-ev" data-d="${ymd(first)}">+ Nova entrada</button></div>
  </section>
  <div class="chips" style="margin-bottom:12px">${Object.entries(FONTES).map(([k,[l,c]]) => `<button class="chip src ${c}" data-act="fonte-toggle" data-src="${k}" aria-pressed="${hide[k] ? 'false' : 'true'}"><span class="sw"></span>${l}</button>`).join('')}</div>
  ${srcStatusLine(['google','m365-cal'])}${liveErrors(['google','m365-cal'])}
  <div class="mgrid">${DIAS_C.map(d => `<div class="wd">${d}</div>`).join('')}${cells}</div>
  <div class="mlist daylist" style="flex-direction:column">${(() => { let h = ''; for (let d = new Date(first); d <= last; d = addDays(d,1)) { const de = evs.filter(e => onDay(e, d)); if (!de.length) continue; h += `<div><div class="dh">${cap(DIAS[wdIdx(d)])} <small>${fmtShort(d)}</small></div><div class="evs">${de.map(evChip).join('')}</div></div>`; } return h || '<p class="empty">Sem entradas este mês.</p>'; })()}</div>
  <div class="grid-2" style="margin-top:16px">
    <section class="card"><h2>Notas do mês</h2><textarea class="ruled" id="notas-mes" data-bind="anual.notasMes.${mk}" placeholder="Objetivos, lembretes e balanço do mês">${esc((Store.get('anual').notasMes || {})[mk] || '')}</textarea></section>
    <section class="card"><h2>Datas a lembrar</h2>${keyDates.length ? `<div class="evs" style="display:flex;flex-direction:column;gap:4px">${keyDates.map(e => `<div class="row" style="flex-wrap:nowrap"><span class="muted small tnum" style="width:92px;flex:none">${fmtShort(e.start)}${e.allDay && ymd(addDays(e.end,-1)) !== ymd(e.start) ? '–' + fmtShort(addDays(e.end,-1)) : ''}</span>${evChip(e)}</div>`).join('')}</div>` : '<p class="empty">Sem feriados nem datas-chave este mês.</p>'}</section>
  </div>`;
}

/* ---------- Vista: Semana ---------- */
function vSemana(){
  const sy = schoolYear(S().inicio);
  if (!UI.semana) UI.semana = ymd(mondayOf(new Date()));
  const mon = parseYMD(UI.semana), sun = addDays(mon, 6);
  const evs = eventsBetween(mon, addDays(mon, 7));
  const wn = weekNo(mon, sy);
  const wk = UI.semana;
  const sem = Store.get('semanas')[wk] || {};
  const tasks = Store.get('tarefas').lista.filter(x => x.data && x.data >= ymd(mon) && x.data <= ymd(sun)).sort((a,b) => (a.feito - b.feito) || a.data.localeCompare(b.data));
  const todayS = ymd(new Date());
  const dayCol = (d, compact) => {
    const de = evs.filter(e => onDay(e, d)); const fl = dayFlags(d, evs);
    const shown = de.filter(e => e.src !== 'interrupcao');
    return `<div class="wday${ymd(d) === todayS ? ' today' : ''}${fl.int ? ' hatch' : ''}">
      <h3><span>${DIAS_C[wdIdx(d)]} ${d.getDate()}</span><small>${fl.fer.length ? esc(fl.fer[0].title) : fl.int ? 'Interrupção letiva' : MESES_C[d.getMonth()]}</small></h3>
      <div style="display:flex;flex-direction:column;gap:3px">${shown.filter(e => e.src !== 'feriado').map(evChip).join('') || '<span class="muted small">Sem entradas</span>'}</div>
      <p class="lbl">Plano</p>
      <textarea class="ruled" id="plano-${ymd(d)}" data-bind="${dayPath(d,'plano')}" style="${compact ? 'min-height:84px' : ''}" placeholder="${compact ? '' : 'Aulas, preparação, recados…'}">${esc(dayVal(d,'plano'))}</textarea>
      <button class="btn sm ghost" data-act="novo-ev" data-d="${ymd(d)}">+ Entrada</button>
    </div>`;
  };
  return `
  <section class="page-head">
    <div><p class="hand">${wn ? 'Semana ' + wn : 'Semana'}</p><h1>${mon.getDate()} ${MESES_C[mon.getMonth()]} – ${sun.getDate()} ${MESES_C[sun.getMonth()]} ${sun.getFullYear()}</h1><p class="meta">${wn ? `Semana ${wn} de 53 do ano letivo ${sy.label}` : 'Fora do ano letivo'}</p></div>
    <div class="head-actions"><button class="btn" data-act="sem-nav" data-k="-1" aria-label="Semana anterior">‹ Anterior</button><button class="btn" data-act="sem-nav" data-k="0">Esta semana</button><button class="btn" data-act="sem-nav" data-k="1" aria-label="Semana seguinte">Seguinte ›</button></div>
  </section>
  ${srcStatusLine(['google','m365-cal'])}${liveErrors(['google','m365-cal'])}
  <section class="card" style="margin-bottom:14px"><div class="row" style="flex-wrap:nowrap"><span class="hand" style="font-size:24px;flex:none">Foco da semana</span><input class="line" type="text" id="foco" data-bind="semanas.${wk}.foco" value="${esc(sem.foco || '')}" placeholder="O que faria desta semana uma boa semana?"></div></section>
  <div class="wgrid">
    ${[0,1,2,3,4].map(i => dayCol(addDays(mon, i))).join('')}
    <div class="wend">${dayCol(addDays(mon, 5), true)}${dayCol(addDays(mon, 6), true)}</div>
  </div>
  <div class="grid-3" style="margin-top:16px">
    <section class="card"><h2>Tarefas da semana <span class="count">${tasks.filter(x => !x.feito).length} por fazer</span></h2>${tasks.length ? tasks.map(taskRow).join('') : '<p class="empty">Sem tarefas com data nesta semana.</p>'}
      <div class="row" style="margin-top:8px;flex-wrap:nowrap"><input type="text" id="qt-sem" placeholder="Nova tarefa (fica para segunda)…" style="flex:1" data-enter="tarefa-semana"><button class="btn sm" data-act="tarefa-semana">Juntar</button></div></section>
    <section class="card"><h2>Reflexão da semana</h2><textarea class="ruled" id="refl" data-bind="semanas.${wk}.reflexao" placeholder="O que resultou? O que mudo?">${esc(sem.reflexao || '')}</textarea></section>
    <section class="card"><h2>Para a próxima semana</h2><textarea class="ruled" id="prox" data-bind="semanas.${wk}.proxima" placeholder="Preparar, pedir, lembrar…">${esc(sem.proxima || '')}</textarea></section>
  </div>`;
}

/* ---------- Vista: Ano letivo ---------- */
function vAno(){
  const s = S(), A = Store.get('anual'), sy = schoolYear(s.inicio);
  const evs = derivedEvents(sy.start, addDays(sy.end, 62));
  const todayS = ymd(new Date());
  const minis = sy.months.map(mk => {
    const [y, m] = mk.split('-').map(Number); const first = new Date(y, m-1, 1), last = new Date(y, m, 0);
    let g = DIAS_C.map(d => `<span class="h">${d[0]}</span>`).join('');
    for (let i = 0; i < wdIdx(first); i++) g += '<span></span>';
    for (let d = new Date(first); d <= last; d = addDays(d,1)) {
      const de = evs.filter(e => onDay(e, d));
      const cls = [ymd(d) === todayS ? 'tod' : '', de.some(e => e.src === 'feriado' && e.tipo !== 'tolerancia') ? 'fer' : '', de.some(e => e.src === 'interrupcao') ? 'int' : '', de.some(e => e.src === 'datas' || e.src === 'aval') ? 'key' : '', wdIdx(d) >= 5 ? 'we' : ''].filter(Boolean).join(' ');
      g += `<span class="${cls}" title="${esc(de.map(e => e.title).join(' · '))}">${d.getDate()}</span>`;
    }
    return `<div class="mini" role="button" tabindex="0" data-act="mes-set" data-m="${mk}" aria-label="Abrir ${MESES[m-1]} de ${y}"><h3>${MESES[m-1]} <span class="muted small">${y}</span></h3><div class="g">${g}</div></div>`;
  }).join('');
  const fer = feriadosEntre(sy.start, sy.end, s.municipal);
  const H = A.horario || {}, slots = A.horarioSlots || [];
  return `
  <section class="page-head">
    <div><p class="hand">Visão anual</p><h1>Ano letivo ${sy.label}</h1><p class="meta">53 semanas, de ${fmtShort(sy.start)} ${sy.start.getFullYear()} a ${fmtShort(addDays(sy.end,-1))} ${addDays(sy.end,-1).getFullYear()}</p></div>
    <div class="head-actions">
      <label class="field">1.ª segunda-feira do ano<input type="date" id="inicio" data-bind="settings.inicio" data-rerender value="${esc(s.inicio)}"></label>
      <label class="check"><input type="checkbox" id="municipal" data-bind="settings.municipal" data-rerender ${s.municipal ? 'checked' : ''}> Feriado municipal de V. N. de Gaia (24 jun)</label>
    </div>
  </section>
  <div class="yeargrid">${minis}</div>
  <div class="legend"><span style="--c:color-mix(in srgb, var(--s-feriado) 30%, transparent)"><i></i>Feriado</span><span style="--c:color-mix(in srgb, var(--s-interrupcao) 35%, transparent)"><i></i>Interrupção letiva</span><span style="--c:var(--s-datas)"><i style="height:3px"></i>Data-chave ou avaliação</span><span style="--c:var(--ink)"><i></i>Hoje</span></div>

  <section class="card" style="margin-top:18px"><h2>Datas-chave <span class="count">Calendário escolar 2026/27 (Despacho n.º 8368/2024, com alterações) — confirma com a tua escola</span></h2>
    <div class="tablewrap"><table class="t"><thead><tr><th style="width:150px">Início</th><th style="width:150px">Fim</th><th>Descrição</th><th style="width:190px">Tipo</th><th style="width:40px"></th></tr></thead><tbody>
    ${[...(A.datas || [])].sort((a,b) => (a.ini||'').localeCompare(b.ini||'')).map(k => `<tr>
      <td><input type="date" id="dk-i-${k.id}" data-bind="anual.datas[#${k.id}].ini" data-rerender value="${esc(k.ini)}"></td>
      <td><input type="date" id="dk-f-${k.id}" data-bind="anual.datas[#${k.id}].fim" data-rerender value="${esc(k.fim)}"></td>
      <td><input type="text" id="dk-t-${k.id}" data-bind="anual.datas[#${k.id}].titulo" value="${esc(k.titulo)}" placeholder="Descrição"></td>
      <td><select id="dk-y-${k.id}" data-bind="anual.datas[#${k.id}].tipo" data-rerender>${TIPOS_DATA.map(([v,l]) => `<option value="${v}"${k.tipo === v ? ' selected' : ''}>${l}</option>`).join('')}</select></td>
      <td><button class="iconbtn" data-act="row-del" data-path="anual.datas" data-id="${k.id}" aria-label="Apagar data">×</button></td></tr>`).join('')}
    </tbody></table></div>
    <button class="btn sm" style="margin-top:8px" data-act="row-add" data-path="anual.datas" data-tpl="data">+ Data-chave</button>
  </section>

  <div class="grid-2e" style="margin-top:16px">
    <section class="card"><h2>Objetivos do ano</h2>
      ${(A.objetivos || []).length ? A.objetivos.map(o => `<div class="task${o.feito ? ' done' : ''}"><input type="checkbox" id="ob-c-${o.id}" data-bind="anual.objetivos[#${o.id}].feito" data-rerender ${o.feito ? 'checked' : ''} aria-label="Concluído"><input class="line" type="text" id="ob-t-${o.id}" data-bind="anual.objetivos[#${o.id}].txt" value="${esc(o.txt)}" placeholder="Objetivo"><button class="iconbtn" data-act="row-del" data-path="anual.objetivos" data-id="${o.id}" aria-label="Apagar objetivo">×</button></div>`).join('') : '<p class="empty">Ainda sem objetivos. Escreve dois ou três que queiras ver cumpridos em julho.</p>'}
      <button class="btn sm" style="margin-top:8px" data-act="row-add" data-path="anual.objetivos" data-tpl="objetivo">+ Objetivo</button>
    </section>
    <section class="card"><h2>Feriados no ano letivo</h2>
      <div style="columns:2; column-gap:18px; font-size:13.5px">${fer.map(f => `<div style="break-inside:avoid; padding:2px 0"><span class="tnum muted" style="display:inline-block;width:56px">${fmtShort(parseYMD(f.date))}</span>${esc(f.nome)}${f.tipo === 'tolerancia' ? ' <span class="muted small">(tolerância habitual)</span>' : ''}</div>`).join('')}</div>
    </section>
  </div>

  <section class="card" style="margin-top:16px"><h2>Horário semanal</h2>
    <div class="tablewrap"><table class="t hor"><thead><tr><th style="width:100px">Hora</th>${['Segunda','Terça','Quarta','Quinta','Sexta','Sábado'].map(d => `<th>${d}</th>`).join('')}<th style="width:40px"></th></tr></thead><tbody>
    ${slots.map((h, i) => `<tr><td><input type="time" id="slot-${i}" data-bind="anual.horarioSlots.${i}" value="${esc(h)}"></td>${[0,1,2,3,4,5].map(d => `<td><input type="text" id="hor-${i}-${d}" data-bind="anual.horario.s${i}d${d}" value="${esc(H['s'+i+'d'+d] || '')}" aria-label="Horário"></td>`).join('')}<td><button class="iconbtn" data-act="slot-del" data-i="${i}" aria-label="Apagar linha">×</button></td></tr>`).join('')}
    </tbody></table></div>
    <button class="btn sm" style="margin-top:8px" data-act="slot-add">+ Linha</button>
  </section>

  <div class="grid-2e" style="margin-top:16px">
    <section class="card"><h2>Contactos</h2>
      <div class="tablewrap"><table class="t"><thead><tr><th>Nome</th><th>Função / instituição</th><th>Email</th><th>Telefone</th><th></th></tr></thead><tbody>
      ${(A.contactos || []).map(c => `<tr><td><input type="text" id="ct-n-${c.id}" data-bind="anual.contactos[#${c.id}].nome" value="${esc(c.nome)}"></td><td><input type="text" id="ct-f-${c.id}" data-bind="anual.contactos[#${c.id}].funcao" value="${esc(c.funcao)}"></td><td><input type="email" id="ct-e-${c.id}" data-bind="anual.contactos[#${c.id}].email" value="${esc(c.email)}"></td><td><input type="tel" id="ct-t-${c.id}" data-bind="anual.contactos[#${c.id}].tel" value="${esc(c.tel)}"></td><td style="white-space:nowrap">${/@/.test(c.email || '') ? `<button class="btn sm ghost" data-act="mail-novo" data-to="${esc(c.email)}">Escrever</button>` : ''}<button class="iconbtn" data-act="row-del" data-path="anual.contactos" data-id="${c.id}" aria-label="Apagar contacto">×</button></td></tr>`).join('') || '<tr><td colspan="5" class="muted small" style="padding:10px">Direção, secretaria, coordenação de curso, colegas de projeto…</td></tr>'}
      </tbody></table></div>
      <button class="btn sm" style="margin-top:8px" data-act="row-add" data-path="anual.contactos" data-tpl="contacto">+ Contacto</button>
    </section>
    <section class="card"><h2>Formação e carreira</h2>
      <div class="tablewrap"><table class="t"><thead><tr><th>Ação</th><th>Entidade</th><th style="width:70px">Horas</th><th style="width:140px">Data</th><th style="width:120px">Estado</th><th></th></tr></thead><tbody>

  } else if (UI.ucTab === 'pres') {
    const cols = ses.filter(x => x.data);

      <div class="tablewrap"><table class="t"><thead><tr><th>Estudante</th>${cols.map((x,i) => `<th class="c" title="${esc(x.tema || '')}">${i+1}<br><span class="tnum">${fmtShort(parseYMD(x.data))}</span></th>`).join('')}<th class="c">P</th><th class="c">F</th><th class="c">J</th><th class="c">Assiduidade</th></tr></thead><tbody>
      ${est.map(a => { const c = { P:0, F:0, J:0 }; const cells = cols.map(x => { const v = (x.presencas || {})[a.id] || ''; if (v) c[v]++; return `<td class="c"><button class="pres ${v}" data-act="pres" data-s="${x.id}" data-e="${a.id}" aria-label="Presença de ${esc(a.nome)}">${v || '·'}</button></td>`; }).join(''); const tot = c.P + c.F + c.J; return `<tr><td>${esc(a.nome || a.num || '—')}</td>${cells}<td class="c tnum">${c.P}</td><td class="c tnum">${c.F}</td><td class="c tnum">${c.J}</td><td class="c tnum"><b>${tot ? Math.round(100 * c.P / tot) + '%' : '—'}</b></td></tr>`; }).join('')}

  } else if (UI.ucTab === 'aval') {

      ${body}
    </div>
  </div>`;
}
function avalStats(uc){
  const est = uc.estudantes || []; const vals = est.map(a => mediaPonderada(uc.componentes, (uc.notas || {})[a.id])).filter(Boolean);
  if (!vals.length) return '<span class="muted small">Ainda sem notas lançadas.</span>';
  const med = vals.reduce((a,v) => a + v.media, 0) / vals.length; const apr = vals.filter(v => Math.round(v.media) >= 10).length;
  return `<div class="stat"><b>${med.toFixed(1)}</b><span>média da turma</span></div><div class="stat"><b>${apr}/${vals.length}</b><span>com nota ≥ 10</span></div><div class="stat"><b>${Math.round(100*apr/vals.length)}%</b><span>taxa de aprovação</span></div>`;
}

/* ---------- Vista: Reuniões ---------- */
function vReunioes(){
  const t = startOfDay(new Date()); const a = addDays(t, -21), b = addDays(t, 36);
  const evs = eventsBetween(a, b).filter(e => UI.soReunioes ? isMeeting(e) : (!e.allDay && ['google','outlook','ics','manual'].includes(e.src)));
  const R = Store.get('reunioes');
  const now = new Date();
  const prox = evs.filter(e => e.end >= now).sort((x,y) => x.start - y.start);
  const rec = evs.filter(e => e.end < now).sort((x,y) => y.start - x.start);
  const inRange = new Set(evs.map(e => keyOf(e.id)));
  const arquivo = Object.entries(R).filter(([k, r]) => !inRange.has(k) && r && r.titulo).sort((x,y) => String(y[1].quando).localeCompare(String(x[1].quando)));
  if (!UI.reuId && prox[0]) UI.reuId = prox[0].id;
  const sel = UI.evIndex.get(UI.reuId) || null;
  const selKey = sel ? keyOf(sel.id) : (UI.reuId && UI.reuId.startsWith('arq:') ? UI.reuId.slice(4) : null);
  const rec0 = selKey ? (R[selKey] || {}) : {};

  const RP = selKey ? `reunioes.${selKey}` : '';
  const editor = selKey ? `
    <section class="card s-${esc(sel ? sel.src : (rec0.src || 'manual'))}" style="border-top:6px solid var(--c)">
      <div class="row"><div style="flex:1;min-width:0"><p class="hand">${sel ? esc(srcLabel(sel)) : 'Arquivo'}</p><h2 style="font-size:22px">${esc(sel ? sel.title : rec0.titulo)}</h2><p class="muted small" style="margin:4px 0 0">${sel ? esc(fmtWhen(sel)) : (rec0.quando ? esc(cap(fmtLong(new Date(rec0.quando)))) : '')}${sel && sel.loc ? ' · ' + esc(sel.loc) : ''}${sel && sel.org ? ' · organiza ' + esc(sel.org) : ''}</p></div>
      ${sel && sel.join ? `<a class="btn pri" href="${esc(sel.join)}" target="_blank" rel="noopener">Entrar</a>` : ''}${sel && sel.web ? `<a class="btn" href="${esc(sel.web)}" target="_blank" rel="noopener">Abrir no calendário</a>` : ''}</div>
      <div class="form" style="margin-top:12px">
        <label class="field">Tipo<select id="r-tipo" data-bind="${RP}.tipo">${['','Conselho pedagógico','Departamento / área','Coordenação de curso','Projeto / investigação','Orientação','Pais / encarregados de educação','Conselho de turma','Outra'].map(v => `<option${(rec0.tipo || '') === v ? ' selected' : ''} value="${esc(v)}">${v || '—'}</option>`).join('')}</select></label>
        <label class="field">Participantes<input type="text" id="r-part" data-bind="${RP}.participantes" value="${esc(rec0.participantes || '')}" placeholder="${sel && sel.atts ? sel.atts + ' convidados' : 'Quem esteve'}"></label>
        <label class="field full">Ordem de trabalhos<textarea class="ruled" id="r-ordem" data-bind="${RP}.ordem" style="min-height:84px">${esc(rec0.ordem || '')}</textarea></label>
        <label class="field full">Notas<textarea class="ruled" id="r-notas" data-bind="${RP}.notas" style="min-height:168px">${esc(rec0.notas || '')}</textarea></label>
        <label class="field full">Decisões<textarea class="ruled" id="r-dec" data-bind="${RP}.decisoes" style="min-height:84px">${esc(rec0.decisoes || '')}</textarea></label>
      </div>

      st => mailList(st.items, 'gmail', 25))}
    ${col('Outlook', 's-outlook', srcOn('outlookMail'), Live.mail.outlook, 'outlook', 'm365',
      `<div class="row" style="margin-bottom:6px"><label class="field">Mostrar os últimos<select id="od" data-bind="settings.outlookDias">${[3,7,14,30].map(n => `<option value="${n}"${+s.outlookDias === n ? ' selected' : ''}>${n} dias</option>`).join('')}</select></label></div>`,

    ${col('Teams', 's-outlook', srcOn('teams'), Live.teams, 'teams', 'm365',

  ${(() => { const L = (Store.has('correio') ? Store.get('correio').enviados : null) || []; return L.length ? `<section class="card" style="margin-top:16px"><h2>Enviados a partir da agenda <span class="count">últimos ${Math.min(L.length, 12)}</span></h2>${L.slice(0, 12).map(x => `<div class="mail"><div class="top"><span class="from">${x.tipo === 'rascunho' ? 'Rascunho' : x.tipo === 'resposta' ? 'Resposta' : 'Enviado'} · ${esc(x.para || '')}</span><span class="date">${fmtShort(new Date(x.quando))} ${hm(new Date(x.quando))}</span></div><div class="subj">${esc(x.assunto || '(sem assunto)')}</div>${x.link ? `<div class="acts"><a class="btn sm" href="${esc(x.link)}" target="_blank" rel="noopener">Abrir no Gmail</a></div>` : ''}</div>`).join('')}</section>` : ''; })()}

function ctxOptions(sel){
  const ucs = Store.get('ucs').lista.map(u => u.sigla || u.nome);
  const all = [...new Set([...ucs, ...(S().contextos || [])])];
  return `<option value="">Sem contexto</option>` + all.map(c => `<option${sel === c ? ' selected' : ''}>${esc(c)}</option>`).join('') + (sel && !all.includes(sel) ? `<option selected>${esc(sel)}</option>` : '');
}
function taskRow(x){
  const P = `tarefas.lista[#${x.id}]`; const late = !x.feito && x.data && x.data < ymd(new Date());
  return `<div class="task${x.feito ? ' done' : ''}"><input type="checkbox" id="tk-c-${x.id}" data-bind="${P}.feito" data-rerender ${x.feito ? 'checked' : ''} aria-label="Concluída">
    <div style="min-width:0"><input class="line" type="text" id="tk-t-${x.id}" data-bind="${P}.titulo" value="${esc(x.titulo)}" aria-label="Tarefa">${x.link ? `<a class="small" href="${esc(x.link)}" target="_blank" rel="noopener">Abrir origem</a>` : ''}</div>
    <div class="meta">${late ? '<span class="late">atrasada</span>' : ''}<span class="pill prio-${x.prio || 'media'}">${{alta:'alta',media:'média',baixa:'baixa'}[x.prio || 'media']}</span>${x.ctx ? `<span class="pill">${esc(x.ctx)}</span>` : ''}<input type="date" id="tk-d-${x.id}" data-bind="${P}.data" data-rerender value="${esc(x.data)}" aria-label="Data"><button class="iconbtn" data-act="tarefa-del" data-id="${x.id}" aria-label="Apagar tarefa">×</button></div></div>`;
}
function vTarefas(){
  const L = Store.get('tarefas').lista; const t = ymd(new Date()); const sun = ymd(addDays(mondayOf(new Date()), 6));
  const F = {
    hoje: [x => !x.feito && x.data && x.data <= t, 'Hoje e atrasadas'],

    semdata: [x => !x.feito && !x.data, 'Sem data'],

    feitas: [x => x.feito, 'Concluídas']
  };
  const items = L.filter(F[UI.tf][0]).sort((a,b) => (a.data || '9999').localeCompare(b.data || '9999') || ({alta:0,media:1,baixa:2}[a.prio||'media'] - {alta:0,media:1,baixa:2}[b.prio||'media']));

    <section class="card"><h2>Contextos</h2><p class="muted small" style="margin:0 0 8px">Projetos e frentes de trabalho para arrumar as tarefas. As tuas UC entram automaticamente.</p>
      <div class="chips">${(S().contextos || []).map((c, i) => `<span class="chip">${esc(c)}<button class="iconbtn" style="font-size:13px;padding:0 2px" data-act="ctx-del" data-i="${i}" aria-label="Apagar contexto ${esc(c)}">×</button></span>`).join('')}</div>

    </section>
  </div>`;
}

/* ---------- Vista: Ligações ---------- */
function statusPill(keys){
  const sts = keys.map(k => Live.status[k]).filter(Boolean);
  if (sts.some(s => s.state === 'loading')) return '<span class="pill warn">A ligar…</span>';
  if (sts.some(s => s.state === 'err')) return '<span class="pill err">Com erro</span>';
  if (sts.some(s => s.state === 'ok')) return '<span class="pill ok">Ligado</span>';
  return '';
}

    const uc = curUC(); const wd = +$('#g-dia').value, hora = $('#g-hora').value, de = $('#g-de').value, ate = $('#g-ate').value, dur = +$('#g-dur').value || 90;
    if (!de || !ate || ate < de) { toast('Indica um intervalo de datas válido.'); return; }
    uc.duracao = dur;
    const a = parseYMD(de), b = addDays(parseYMD(ate), 1);
    const block = derivedEvents(a, b).filter(e => (e.src === 'feriado' && e.tipo !== 'tolerancia') || e.src === 'interrupcao');
    const existing = new Set(uc.sessoes.map(x => x.data)); let n = 0, skipped = 0;
    for (let d = new Date(a); d < b; d = addDays(d,1)) {
      if (wdIdx(d) !== wd) continue;
      if (block.some(e => onDay(e, d))) { skipped++; continue; }
      if (existing.has(ymd(d))) continue;
      uc.sessoes.push({ id: uid(), data: ymd(d), hora, tema: '', recursos: '', estado: 'planeada', presencas: {} }); n++;
    }
    Store.mark('ucs'); render(true); toast(`Criadas ${n} sessões${skipped ? `; ${skipped} datas saltadas por feriado ou interrupção` : ''}.`);
  },
  'est-add': () => { const uc = curUC(); const x = { id: uid(), num: '', nome: '', email: '', obs: '' }; uc.estudantes.push(x); Store.mark('ucs'); UI.focus = 'e-m-' + x.id; render(true); },
  'est-del': d => { const uc = curUC(); uc.estudantes = uc.estudantes.filter(x => x.id !== d.id); Store.mark('ucs'); render(true); },
  'est-colar': () => {
    const uc = curUC(); const lines = $('#colar').value.split(/\n/).map(l => l.trim()).filter(Boolean); let n = 0;
    for (const l of lines) {
      const parts = l.split(/\s*[;\t]\s*|\s*,\s*(?=\S+@)/).map(x => x.trim()).filter(Boolean);
      let num = '', nome = '', email = '';
      for (const p of parts) { if (/@/.test(p)) email = p; else if (/^\d+$/.test(p) && !num) num = p; else nome = nome ? nome + ' ' + p : p; }
      if (nome || num) { uc.estudantes.push({ id: uid(), num, nome, email, obs: '' }); n++; }
    }
    Store.mark('ucs'); render(true); toast(`${n} estudantes juntos.`);
  },
  pres: (d, el) => {
    const uc = curUC(); const x = uc.sessoes.find(s => s.id === d.s); if (!x) return;
    x.presencas ||= {}; const order = ['', 'P', 'F', 'J']; const cur = x.presencas[d.e] || ''; const nx = order[(order.indexOf(cur) + 1) % 4];
    if (nx) x.presencas[d.e] = nx; else delete x.presencas[d.e];
    Store.mark('ucs'); render(true);
  },
  'comp-add': () => { const uc = curUC(); const c = { id: uid(), nome: 'Nova componente', peso: 0 }; uc.componentes.push(c); Store.mark('ucs'); UI.focus = 'cp-n-' + c.id; render(true); },
  'comp-del': d => { const uc = curUC(); uc.componentes = uc.componentes.filter(c => c.id !== d.id); Store.mark('ucs'); render(true); },
  'aval-add': () => { const uc = curUC(); (uc.avaliacoes ||= []).push({ id: uid(), data: ymd(new Date()), tipo: 'Teste', desc: '' }); Store.mark('ucs'); render(true); },
  'aval-del': d => { const uc = curUC(); uc.avaliacoes = uc.avaliacoes.filter(a => a.id !== d.id); Store.mark('ucs'); render(true); },
  'row-add': d => { const arr = getPath(d.path); const x = TPL[d.tpl](); arr.push(x); Store.mark(tokens(d.path)[0]); UI.focus = FIRST[d.tpl] + x.id; render(true); },
  'row-del': d => { const segs = tokens(d.path); const last = segs.pop(); const parent = getPath(segs.join('.')); parent[last] = (parent[last] || []).filter(x => x.id !== d.id); Store.mark(segs[0]); render(true); },
  'slot-add': () => { const A = Store.get('anual'); A.horarioSlots.push(''); Store.mark('anual'); render(true); },
  'slot-del': d => {
    const A = Store.get('anual'); const i = +d.i; const H = {};
    for (const [k, v] of Object.entries(A.horario || {})) { const m = k.match(/^s(\d+)d(\d+)$/); if (!m) continue; const si = +m[1]; if (si === i) continue; H[`s${si > i ? si - 1 : si}d${m[2]}`] = v; }
    A.horario = H; A.horarioSlots.splice(i, 1); Store.mark('anual'); render(true);
  },
  'ics-del': d => { Store.remove(d.b).then(() => { render(true); paintDots(); toast('Calendário removido.'); }); },
  'backup-copy': async () => {
    const out = {}; for (const n of Store.names()) out[n] = Store.data[n];
    const txt = JSON.stringify({ app: 'agenda-digital', v: 1, criado: new Date().toISOString(), dados: out });
    try { await navigator.clipboard.writeText(txt); toast('Cópia de segurança copiada. Cola-a num documento seguro.'); }
    catch(e) { const ta = $('#backup-in'); ta.value = txt; ta.select(); toast('Não consegui copiar sozinho: a cópia está na caixa abaixo, selecionada.'); }
  },
  'backup-import': async () => {
    let j; try { j = JSON.parse($('#backup-in').value); } catch(e) { toast('O texto colado não é uma cópia válida.'); return; }
    if (!j || j.app !== 'agenda-digital' || !j.dados) { toast('O texto colado não é uma cópia desta agenda.'); return; }
    for (const [k, v] of Object.entries(j.dados)) { if (/^[\w\-.~:@+]+$/.test(k) && v && typeof v === 'object') { Store.data[k] = v; Store.mark(k); } }
    render(true); toast('Cópia reposta.');
  },
  danger: (d, el) => {
    if (el.disabled) return;
    if (!el.dataset.armed) { el.dataset.armed = '1'; el.dataset.label = el.textContent; el.textContent = el.dataset.confirm || 'Confirmar?'; setTimeout(() => { if (el.isConnected && el.dataset.armed) { delete el.dataset.armed; el.textContent = el.dataset.label; } }, 4000); return; }
    el.textContent = el.dataset.label;
    delete el.dataset.armed; ACT[d.then](d, el);
  }
};
document.addEventListener('click', e => {
  const an = e.target.closest('a[data-note]'); if (an) { toast(an.dataset.note); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'INPUT') return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); e.stopPropagation();
  Promise.resolve(fn({ ...el.dataset }, el, e)).catch(err => { console.error(err); toast('Não foi possível concluir: ' + ((err && err.message) || err)); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter && !e.isComposing) { e.preventDefault(); ACT[e.target.dataset.enter]({ ...e.target.dataset }, e.target); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.dataset.act && e.target === document.activeElement) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e => { if (e.target.closest && e.target.closest('#mailform')) mailLinks(); });
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'evform') { const b = $('#f-save'); if (b && !b.disabled) b.click(); }
  // O formulário de email nunca é enviado com Enter: só pelo botão Enviar, com confirmação.
});
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.bind) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.type === 'num') v = v === '' ? '' : Number(String(v).replace(',', '.'));
  setPath(el.dataset.bind, v);
  if (el.dataset.bind.startsWith('settings.oauth')) { const c = Auth.cfg(); const gb = $('#cfg-gbtn'), mb = $('#cfg-mbtn'); if (gb) gb.disabled = !(c.gId && Auth.podeEntrar()); if (mb) mb.disabled = !(c.mId && Auth.podeEntrar()); }
  if (el.dataset.href === 'gq-a') { const a = document.getElementById('gq-a'); if (a) a.href = LINKS.gmailSearch(el.value); }
  if (el.dataset.live === 'nota') {
    const uc = curUC(); const id = el.dataset.e; const r = mediaPonderada(uc.componentes, (uc.notas || {})[id]);
    const set = (i, t) => { const c = document.getElementById(i); if (c) c.textContent = t; };
    set('med-' + id, r ? r.media.toFixed(1) + (r.completo ? '' : '*') : '—'); set('fin-' + id, r ? String(Math.round(r.media)) : '—'); set('men-' + id, r ? rotulo(r.media) : '');
    const st = document.getElementById('aval-stats'); if (st) st.innerHTML = avalStats(uc);
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.actChange === 'so-reu') { UI.soReunioes = el.checked; render(true); return; }
  if (el.dataset && el.dataset.actChange === 'tgroup') { UI.tgroup = el.checked; render(true); return; }
  if (el.id === 'icsfile') { importICS([...el.files]); el.value = ''; return; }
  if (el.id === 'f-dest') { const [m, k] = destMode(el.value); const f = $('#evform'); f.dataset.dest = m; f.dataset.kind = k; const b = $('#f-save'); if (b) b.textContent = destLabel(el.value); return; }
  if (!el.dataset || !el.dataset.bind) return;
  const b = el.dataset.bind;
  if (b.startsWith('settings.gcalCals')) { Live.ev.google = {}; }
  if (b === 'settings.m365.cal') Live.ev.outlook = {};
  if (b === 'settings.m365.mail') Live.mail.outlook = null;
  if (b === 'settings.m365.teams') Live.teams = null;
  if (b === 'settings.gmailUnread' || b === 'settings.outlookDias') { if (b === 'settings.gmailUnread') loadMail('gmail', true); else loadMail('outlook', true); }
  if (el.dataset.rerender !== undefined) render(true);
});

/* ---------- Importação de ficheiros .ics ---------- */
async function importICS(files){
  const sy = schoolYear(S().inicio);
  const winA = addDays(sy.start, -45), winB = addDays(sy.end, 60);
  let total = 0;
  for (const f of files) {
    try {
      const txt = await f.text();
      if (!/BEGIN:VCALENDAR/i.test(txt)) { toast(`${f.name} não parece um ficheiro de calendário.`); continue; }
      const parsed = parseICS(txt);
      const nome = parsed.calName || f.name.replace(/\.ics$/i, '');
      const name = 'ics-' + keyOf(nome).slice(1, 9);
      let eventos = expandICS(parsed, winA, winB, name).map(e => ({ ...e, x: (e.x || '').slice(0, 140) }));
      const size = () => JSON.stringify(eventos).length;
      if (size() > 220000) eventos = eventos.map(e => ({ ...e, x: '' }));
      while (eventos.length && size() > 220000) eventos = eventos.slice(0, Math.floor(eventos.length * 0.85));
      Store.data[name] = { nome, ficheiro: f.name, importado: Date.now(), eventos };
      Store.mark(name); total += eventos.length;
    } catch(e) { toast(`Não consegui ler ${f.name}.`); }
  }
  render(true); paintDots();
  if (total) toast(`Importadas ${total} entradas do ano letivo.`);
}
function wireDrop(){
  const z = $('#drop'); if (!z || z.dataset.wired) return; z.dataset.wired = '1';
  z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('over'); });
  z.addEventListener('dragleave', () => z.classList.remove('over'));
  z.addEventListener('drop', e => { e.preventDefault(); z.classList.remove('over'); importICS([...e.dataTransfer.files].filter(f => /\.ics$/i.test(f.name) || f.type === 'text/calendar')); });
}

/* ---------- Arranque ---------- */
(function boot(){
  Store.lsReadAll();
  UI.authRet = authReturn();
  const h = location.hash.slice(1); if (VIEWS[h]) UI.view = h;
  if (autoSessao(UI.authRet)) return; // a renovar o acesso ao Google; a página volta já
  render(true);
  Store.connect();
  initLive();
  setInterval(() => { paintHeader(); if (UI.view === 'hoje') render(); }, 5 * 60e3);
})();
</script>
